name: CI/CD Docker Pipeline

on:
  push:
    branches: main # Altere para a sua branch principal se necessário

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do projeto no runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Docker Buildx (necessário para builds avançados)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Faz o login no Docker Hub usando os Secrets do GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Faz o Build e o Push da imagem para o Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: paulo0107/pudim:latest